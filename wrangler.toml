# Cloudflare Pages configuration for Harsh Developers.
# database_id is filled in after `wrangler d1 create harsh-developers-db`.
name = "harsh-developers"
compatibility_date = "2026-09-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "harsh-developers-db"
database_id = "5b8d5ae8-c55e-432f-b6bb-10e6b9ca3372"

# R2 bucket for property images — ENABLED 2026-10-08 (bucket created by Firoz).
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "harsh-developers-images"

[vars]
ENVIRONMENT = "production"
